; PlatformIO config for MachineLearning_MotionState example
; Build from this directory: pio run
; Main .ino in root for Arduino CLI; src/ holds classifier and model.

[platformio]
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32s3usbotg
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../..
lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
    thewknd/VEML6040@^0.3.2
    adafruit/Adafruit NeoPixel@^1.12.0
    painlessmesh/painlessmesh@^1.5.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
